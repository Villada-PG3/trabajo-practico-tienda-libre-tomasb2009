<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Tienda Libre</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #f5f5f5;
        color: #333;
      }

      .container {
        max-width: 900px;
        margin: 60px auto;
        padding: 0 20px;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 8px;
      }

      p {
        color: #666;
        margin-bottom: 30px;
      }

      .card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      thead {
        background: #f8f8f8;
      }

      th {
        text-align: left;
        padding: 18px 24px;
        font-size: 0.9rem;
        color: #666;
        font-weight: 600;
        border-bottom: 1px solid #e5e5e5;
      }

      td {
        padding: 18px 24px;
        border-bottom: 1px solid #eee;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      tbody tr:hover {
        background: #fafafa;
      }

      .precio {
        font-weight: bold;
        color: #1d4ed8;
      }

      .stock {
        color: #555;
      }

      .vacio {
        text-align: center;
        color: #888;
        padding: 40px;
      }

      footer {
        margin-top: 25px;
        text-align: center;
        color: #888;
        font-size: 0.9rem;
      }

      @media (max-width: 600px) {
        th,
        td {
          padding: 14px;
          font-size: 0.95rem;
        }

        h1 {
          font-size: 1.7rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Tienda Libre</h1>
      <p>Listado de productos disponibles.</p>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Producto</th>
              <th>Precio</th>
              <th>Stock</th>
            </tr>
          </thead>

          <tbody>
            {% for producto in productos %}
            <tr>
              <td>{{ producto.nombre }}</td>
              <td class="precio">$ {{ producto.precio }}</td>
              <td class="stock">{{ producto.stock }} unidades</td>
            </tr>

            {% empty %}
            <tr>
              <td colspan="3" class="vacio">No hay productos disponibles.</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>

      <footer>Desarrollado con Django</footer>
    </div>
  </body>
</html>
